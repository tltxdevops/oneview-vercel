name: Deploy na Vercel

# Deploy passou para a Pipeline (ci.yml), depois do CI.
# Este arquivo fica só para não disparar o workflow antigo em paralelo.
on:
  workflow_dispatch:

jobs:
  deploy:
    uses: tltxdevops/pipelines/.github/workflows/vercel-deploy.yml@main
    with:
      production_branch: main
      working_directory: dashboard
    secrets: inherit
